name: Tag & Deploy to VPS

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional version label for manual dispatch'
        required: false
        default: 'manual'

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    name: Build in CI & Deploy to VPS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Vue 3 Frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Setup Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: infra/services/api-go/go.sum

      - name: Compile Static Linux Go API Binary
        working-directory: infra/services/api-go
        run: |
          go mod tidy
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o server .

      - name: Package Release Bundle
        run: |
          mkdir -p bundle/infra/caddy/sites bundle/infra/postgres/init bundle/infra/scripts bundle/infra/services/api-go bundle/site
          cp infra/docker-compose.yml bundle/infra/docker-compose.yml
          cp infra/caddy/Caddyfile bundle/infra/caddy/Caddyfile
          cp infra/caddy/sites/* bundle/infra/caddy/sites/
          cp infra/postgres/init/*.sql bundle/infra/postgres/init/
          cp infra/scripts/*.sh bundle/infra/scripts/
          cp infra/services/api-go/* bundle/infra/services/api-go/
          cp -r web/dist/* bundle/site/
          tar -czf release.tar.gz -C bundle .

      - name: Deploy Bundle & Verify Health over Single SSH Connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key

          cat release.tar.gz | ssh -i ~/.ssh/vps_key -o StrictHostKeyChecking=accept-new root@${{ secrets.VPS_HOST }} '
            set -e
            TMP_DIR=$(mktemp -d)
            tar -xzf - -C "${TMP_DIR}"

            # Sync infrastructure configs & pre-compiled Go binary
            cp -r "${TMP_DIR}/infra/"* /opt/infra/
            chmod +x /opt/infra/scripts/*.sh

            # Sync compiled Vue SPA assets to both default and trigamedev.org web roots
            mkdir -p /opt/infra/sites/trigamedev.org /opt/infra/sites/default
            cp -r "${TMP_DIR}/site/"* /opt/infra/sites/trigamedev.org/
            cp -r "${TMP_DIR}/site/"* /opt/infra/sites/default/
            rm -rf "${TMP_DIR}"

            cd /opt/infra
            docker exec -i infra-postgres psql -U postgres -d main < /opt/infra/postgres/init/02-trigamedev.sql
            docker compose up -d --build api-go
            docker exec infra-caddy caddy reload --config /etc/caddy/Caddyfile

            sleep 2
            curl -sf http://127.0.0.1/api/go/health
            echo ""
            echo "Deployment complete!"
          '
